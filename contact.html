</head>
<body>
<header class="navbar">
    <div class="logo">Afterglow</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="products.html">Products</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>
<main>
     <div class="contact-section">
    <div class="contact-title">Contact Us</div>
    <div class="contact-wrapper">
      <!-- Left: Form -->
      <div class="contact-form-container">
        <form class="contact-form" action="#" method="post" autocomplete="off">
          <div class="form-group">
            <label for="name">Your Name</label>
            <input id="name" name="name" type="text" required placeholder="Enter your name">
          </div>
          <div class="form-group">
            <label for="email">Your Email</label>
            <input id="email" name="email" type="email" required placeholder="Enter your email">
          </div>
          <div class="form-group">
            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="4" required placeholder="Type your message"></textarea>
          </div>
          <button type="submit" class="send-btn">Send Message</button>
        </form>
      </div>
      <!-- Right: Info & Map -->
      <div class="contact-info-map">
        <div class="contact-info">
          <div class="info-item"><span class="info-icon">📞</span> <strong>Phone:</strong> (123) 456-7890</div>
          <div class="info-item"><span class="info-icon">✉️</span> <strong>Email:</strong> info@afterglow.com</div>
          <div class="info-item"><span class="info-icon">📍</span> <strong>Address:</strong> 123 Long Street, Cape Town</div>
        </div>
        <div class="map-container">
          <iframe
            title="Nightclub & Bar Location"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3310.5027266321966!2d18.416403676443704!3d-33.92527847447978!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1dcc676767676767%3A0x123456789abcdef!2s123%20Long%20St%2C%20Cape%20Town%20City%20Centre%2C%20Cape%20Town%2C%208000%2C%20South%20Africa!5e0!3m2!1sen!2sza!4v1695742183199!5m2!1sen!2sza"
            width="100%" height="210" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>
      </div>
    </div>
  </div>
</main>
<footer>
    <div>
        <div class="footer-logo">Afterglow</div>
        <div class="footer-address">123 Long Street, Cape Town, 8000</div>
    </div>
    <div class="footer-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>

        <a href="contact.html">Contact</a>
    </div>

        © 2025 Afterglow Nightclub & Bar. All rights reserved.
    </div>
</footer>
</body>
</html>
